global:
  resolve_timeout: 5m

route:
  receiver: "telegram-default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: "telegram-default"
    telegram_configs:
      - bot_token: "REPLACE_WITH_ALERT_BOT_TOKEN"
        chat_id: 0
        parse_mode: "HTML"
